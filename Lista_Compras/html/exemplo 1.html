<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Exemplo</title>
    <!-- <script src="funcoes.js" defer></script> -->
</head>

<body>

    <h1>Formulário</h1>

    <form>
        <label for="nome">Nome: </label>
        <input type="text" id="nome" required pattern="[a-zA-Z ]+" placeholder="Nome completo" maxlength="100" />
        <br><br>
        <label for="tel"> Telefone: </label>
        <input type="tel" class="tel" placeholder="(84) 99999-9999" maxlength="11" pattern="[0-9]" /><br><br>

        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar">
    </form>

    <hr>
    <ul id="lista">
        <li id="i1"> Senac </li>
    </ul>

    <script>
        let botao = document.querySelector('[type=submit]')

        botao.addEventListener('click', (event) => {
            event.preventDefault()
            let nome = document.getElementById('nome').value
            let tel = document.getElementsByClassName('tel')   //querySelectorAll
            alert(`Nome: ${nome} - Telefone: ${tel[0].value}`) // visualizar os dados

            let lista = document.getElementById('lista')
            let item = document.createElement('li') // criação de elemento
            item.innerHTML = nome
            lista.appendChild(item) // adição do item na lista

            let i1 = document.getElementById('i1')
            i1.remove()  // remoção do item da lista

        })
    </script>


</body>

</html>
