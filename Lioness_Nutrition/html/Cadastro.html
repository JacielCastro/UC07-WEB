<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Lioness Nutrition </title>
    <script src="../src/funcoes_Nutri.js" defer></script>
</head>
<body>
<header>
    <h2> Lioness Nutrition </h2>
    <br>
    <h2 id="h2"> Cadastro De Paciente </h2>
</header>
<hr>
<!-- FORMULÁRIO -->
<h2><U> Dados Do Paciente </U></h2>
<br>
<label for="input-nome" class="label-cadastro"> Nome </label>
<input type="text" id="input-nome" class="input-cadastro" placeholder="Insira seu nome ">
<br>
<label for="input-data" class="label-cadastro"> Data De Nascimento </label> 
<input type="date" id="input-data" class="input-cadastro" placeholder=" Informe a sua data de nascimento">
<br>
<label for="input-email" class="label-cadastro"> E-mail </label>
<input type="email" id="input-email" class="input-cadastro" placeholder=" Informe o seu e-mail">
<br>
<label for="input-tel" class="label-cadastro"> Telefone </label>
<input type="tel" id="input-tel" class="input-cadastro" placeholder="Informe o seu Telefone">
<br>
<label for="input-endereco" class="label-cadastro"> Endereço </label>
<input type="text" id="input-endereco" class="input-cadastro" placeholder="Informe o seu endereço">
<br>
<label for="input-numero" class="label-cadastro"> Número </label>
<input type="number" id="input-numero" class="input-cadastro" placeholder="informe a sua profissão">
<br>
<label for="input-profissao" class="label-cadastro"> Profissão </label>
<input type="text" id="input-profissao" class="input-cadastro" placeholder="informe a sua profissão">
<br>
<label for="input-altura" class="label-cadastro"> Altura </label>
<input type="number" id="input-altura" class="input-cadastro" placeholder="informe a sua altura">
<br>
<label for="input-peso" class="label-cadastro" > Peso </label>
<input type="number" id="input-peso" class="input-cadastro" placeholder="informe o seu peso">
<br><br>
<button id="botao" > Cadastro </button>
<br><br>
<h2><u> Informações Dos Pacientes </u></h2>
<br>
    <!-- TABELA -->
    <table border="1px" id="tabela">
        <thead>
            <tr>
                <th> Nome </th>
                <th> Data Nascimento </th>
                <th> E-mail </th>
                <th> Telefone </th>
                <th> Endereço </th>
                <th> Número </th>
                <th> Profissão </th>
                <th> Altura </th>
                <th> Peso </th>
                <th> Ações </th>
            </tr>
        </thead>
        <tbody>
           
        </tbody>
    </table>

    
</body>
</html>
