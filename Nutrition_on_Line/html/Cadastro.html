<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> NUTRITION ON LINE </title>
    <script src="../src/funcoes.js" defer ></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header>
    <h2> NUTRITION ON LINE </h2>
    <br>
    <h2 id="h2"> Cadastro De Paciente </h2>
</header>
<hr>

<h2><U> Dados Do Paciente </U></h2>
<br>
<label for="input-nome" class="label-cadastro"> Nome </label>
<input type="text" id="input-nome" placeholder="Insira seu nome ">
<br>
<label for="input-data" class="label-cadastro"> Data De Nascimento </label> 
<input type="date" id="input-data" placeholder=" Informe a sua data de nascimento">
<br>
<label for="input-email" class="label-cadastro"> E-mail </label>
<input type="email" id="input-email" placeholder=" Informe o seu e-mail">
<br>
<label for="input-tel" class="label-cadastro"> Telefone </label>
<input type="tel" id="input-tel" placeholder="Informe o seu Telefone">
<br>
<label for="input-endereco" class="label-cadastro"> Endereço </label>
<input type="text" id="input-endereco" placeholder="Informe o seu endereço">
<br>
<label for="input-profissao" class="label-cadastro"> Profissão </label>
<input type="text" id="input-profissao" placeholder="informe a sua profissão">
<br>
<label for="input-altura" class="label-cadastro"> Altura </label>
<input type="number" id="input-altura" placeholder="informe a sua altura">
<br>
<label for="input-peso" class="label-cadastro"> Peso </label>
<input type="number" id="input-peso" placeholder="Informe o seu peso">
<br><br>
<button id="Cadastra"> Cadastra </button>

<h2><u> Informações Dos Pacientes </u></h2>
<br>
    <table id="tabela"> <!-- Tabela -->
        <thead> <!-- Cabeçalho da tabela -->
            <tr> <!-- Linha  -->
                <th> Nome </th> <!-- Atributos da linha -->
                <th> Data de Nascimento</th>
                <th> e-mail </th>
                <th> Telefone </th>
                <th> Endereço </th>
                <th> Profissão </th>
                <th> altura </th>
                <th> Peso </th>
                <th> IMC </th>
                <th> Ações </th>
            </tr>
        </thead>
        <tbody> <!-- Corpo da tabela -->
            <tr> <!-- Linha da Tabela --> <!-- Atributos da linha ou célula -->
                 
            </tr>
        </tbody>
    </table>
</body>
</html>
